openapi: 3.1.0
info:
  title: Call Calendar API
  description: Simplified Cal.com-like call booking service.
  version: 0.0.0
tags: []
paths:
  /available-slots:
    get:
      operationId: listAvailableSlots
      parameters:
        - name: typeId
          in: query
          required: true
          schema:
            type: string
          explode: false
        - name: date
          in: query
          required: true
          schema:
            type: string
          explode: false
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TimeSlot'
  /bookings:
    get:
      operationId: listBookings
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Booking'
    post:
      operationId: createBooking
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBookingRequest'
  /health:
    get:
      operationId: getHealth
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /meeting-types:
    get:
      operationId: listMeetingTypes
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MeetingType'
    post:
      operationId: createMeetingType
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeetingType'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMeetingTypeRequest'
components:
  schemas:
    Booking:
      type: object
      required:
        - id
        - meeting_type_id
        - start_time
        - end_time
        - guest_name
        - guest_email
      properties:
        id:
          type: string
        meeting_type_id:
          type: string
        start_time:
          type: string
          format: date-time
        end_time:
          type: string
          format: date-time
        guest_name:
          type: string
        guest_email:
          type: string
    CreateBookingRequest:
      type: object
      required:
        - meeting_type_id
        - start_time
        - guest_name
        - guest_email
      properties:
        meeting_type_id:
          type: string
        start_time:
          type: string
          format: date-time
        guest_name:
          type: string
        guest_email:
          type: string
    CreateMeetingTypeRequest:
      type: object
      required:
        - title
        - description
        - duration_minutes
      properties:
        title:
          type: string
        description:
          type: string
        duration_minutes:
          type: integer
          format: int32
    ErrorResponse:
      type: object
      required:
        - message
      properties:
        message:
          type: string
    HealthResponse:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - ok
    MeetingType:
      type: object
      required:
        - id
        - title
        - description
        - duration_minutes
      properties:
        id:
          type: string
        title:
          type: string
        description:
          type: string
        duration_minutes:
          type: integer
          format: int32
    TimeSlot:
      type: object
      required:
        - start_time
        - end_time
        - is_available
      properties:
        start_time:
          type: string
          format: date-time
        end_time:
          type: string
          format: date-time
        is_available:
          type: boolean
servers:
  - url: http://localhost:8081
    description: Local development
    variables: {}
